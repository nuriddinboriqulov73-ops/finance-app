<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finance App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:url('bg.jpg') no-repeat center center/cover;
  min-height:100vh;
  color:#fff;
}

body::before{
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  top:0;left:0;
  z-index:-1;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.hidden{display:none;}

.card{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border:1px solid rgba(255,255,255,0.2);
  padding:15px;
  margin-top:15px;
  border-radius:20px;
}

.logo{
  width:90px;
  display:block;
  margin:0 auto 15px;
}

/* INPUT */
.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.row input,.row select{
  flex:1;
  background:rgba(255,255,255,0.1);
  border:none;
  border-radius:12px;
  padding:12px;
  color:#fff;
}

.row input{flex:2;}

/* BUTTON */
.add-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.add-btn:hover{transform:scale(1.05);}
.add-btn:active{transform:scale(0.95);}

/* ITEM */
.item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  margin-top:8px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
}

.actions{display:flex;gap:5px;}
.actions button{
  width:35px;height:35px;border:none;border-radius:8px;
}
.actions button:last-child{
  background:#ef4444;
}

/* LOADING */
.loading{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.loader{
  width:50px;height:50px;
  border:5px solid #fff;
  border-top:5px solid transparent;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

/* SUCCESS */
.success{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}

canvas{width:100%!important;height:220px!important;}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="loader"></div>
</div>

<div class="success" id="success">✔ Saqlandi</div>

<div id="auth" class="container">
<img src="logo.jpg" class="logo">

<div class="card">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="add-btn" onclick="login()">Kirish</button>
</div>
</div>

<div id="app" class="container hidden">

<div class="card">
<h2 id="balance">Balans: 0</h2>
<p id="income">Kirim: 0</p>
<p id="expense">Chiqim: 0</p>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">
<div class="row">
<input id="amount" placeholder="Summa">
<select id="type">
<option value="income">Kirim</option>
<option value="expense">Chiqim</option>
</select>
</div>
<button class="add-btn" onclick="add()">Qo‘shish</button>
</div>

<div class="card" id="list"></div>

<button class="add-btn" onclick="logout()">Chiqish</button>

</div>

<script>
const supabaseClient = supabase.createClient("https://stcuwmhrnokmyonycqcj.supabase.co","sb_publishable_-3rNzJ68C7OVcKGYOeDWvw_VC5n-jye");

let user=null;
let chartInstance;

function showLoading(x){loading.style.display=x?'flex':'none';}
function showSuccess(){
  success.style.display='block';
  setTimeout(()=>success.style.display='none',1500);
}

supabaseClient.auth.onAuthStateChange((e,s)=>{
if(s){user=s.user;auth.classList.add('hidden');app.classList.remove('hidden');load();}
else{auth.classList.remove('hidden');app.classList.add('hidden');}
});

async function login(){
showLoading(true);
await supabaseClient.auth.signInWithPassword({
email:email.value,password:password.value});
showLoading(false);
}

async function logout(){
await supabaseClient.auth.signOut();
}

async function add(){
showLoading(true);
await supabaseClient.from('transactions').insert({
type:type.value,
amount:Number(amount.value),
user_id:user.id
});
showLoading(false);
showSuccess();
load();
}

async function load(){
let {data}=await supabaseClient.from('transactions')
.select('*').eq('user_id',user.id);

let inc=0,exp=0;
list.innerHTML='';

data.forEach(t=>{
t.type==='income'?inc+=t.amount:exp+=t.amount;

let div=document.createElement('div');
div.className='item';
div.innerHTML=`
<span>${t.type} - ${t.amount}</span>
<div class="actions">
<button onclick="del('${t.id}')">❌</button>
</div>`;
list.appendChild(div);
});

balance.innerText="Balans: "+(inc-exp);
income.innerText="Kirim: "+inc;
expense.innerText="Chiqim: "+exp;

draw(inc,exp);
}

async function del(id){
await supabaseClient.from('transactions').delete().eq('id',id);
load();
}

function draw(i,e){
const ctx=document.getElementById('chart');
if(chartInstance) chartInstance.destroy();
chartInstance=new Chart(ctx,{
type:'doughnut',
data:{datasets:[{data:[i,e]}]},
options:{cutout:'70%'}
});
}
</script>

</body>
</html>
