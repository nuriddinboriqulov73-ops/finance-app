<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finance App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

/* BODY */
body{
  font-family:'Segoe UI',sans-serif;
  background:url('bg.jpg') no-repeat center center/cover;
  min-height:100vh;
  color:#fff;
}

body::before{
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  top:0;left:0;
  z-index:-1;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.hidden{display:none;}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  padding:15px;
  margin-top:15px;
  border-radius:20px;
}

/* LOGO */
.logo{
  width:80px;
  display:block;
  margin:0 auto 15px;
}

/* INPUT */
.input-box{
  display:flex;
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

.input-box span{margin-right:10px;}

.input-box input{
  border:none;
  background:none;
  outline:none;
  color:#fff;
  width:100%;
}

input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  cursor:pointer;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
}

canvas{
  width:100%!important;
  height:250px!important;
}

/* MODAL */
#modal{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

#modal.show{display:flex;}

.modal-box{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth" class="container">

<img src="logo.png" class="logo">

<div class="card">
<h2>Login</h2>

<div class="input-box">
<span>👤</span>
<input id="email">
</div>

<div class="input-box">
<span>🔒</span>
<input id="password" type="password">
</div>

<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

</div>

<!-- APP -->
<div id="app" class="container hidden">

<div class="card">
<h2 id="balance">Balans: 0</h2>
<p id="income">Kirim: 0</p>
<p id="expense">Chiqim: 0</p>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">
<input id="amount" placeholder="Summa">
<select id="type">
<option value="income">Kirim</option>
<option value="expense">Chiqim</option>
</select>
<button onclick="add()">Qo‘shish</button>
</div>

<div class="card" id="list"></div>

<button onclick="logout()">Chiqish</button>

</div>

<!-- MODAL -->
<div id="modal">
<div class="modal-box">
<h3>Summa o‘zgartirish</h3>
<input id="editAmount">
<button onclick="saveEdit()">Saqlash</button>
<button onclick="closeModal()">Bekor</button>
</div>
</div>

<script>

const supabaseClient = supabase.createClient(
"https://stcuwmhrnokmyonycqcj.supabase.co",
"sb_publishable_-3rNzJ68C7OVcKGYOeDWvw_VC5n-jye"
);

let user=null;
let editId=null;

/* AUTH */
supabaseClient.auth.onAuthStateChange((event,session)=>{
if(session){
user=session.user;
openApp();
}else{
document.getElementById('auth').classList.remove('hidden');
document.getElementById('app').classList.add('hidden');
}
});

function openApp(){
document.getElementById('auth').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');
loadData();
}

async function signup(){
await supabaseClient.auth.signUp({
email:email.value,
password:password.value
});
}

async function login(){
await supabaseClient.auth.signInWithPassword({
email:email.value,
password:password.value
});
}

async function logout(){
await supabaseClient.auth.signOut();
}

/* DATA */
async function add(){
await supabaseClient.from('transactions').insert({
type:type.value,
amount:amount.value,
user_id:user.id
});
loadData();
}

async function loadData(){
let {data}=await supabaseClient.from('transactions')
.select('*')
.eq('user_id',user.id);

let income=0,expense=0;
list.innerHTML='';

data.forEach(t=>{
if(t.type==='income') income+=t.amount;
else expense+=t.amount;

let div=document.createElement('div');
div.className='item';
div.innerHTML=`${t.type} - ${t.amount}
<button onclick="edit('${t.id}',${t.amount})">✏️</button>
<button onclick="del('${t.id}')">❌</button>`;
list.appendChild(div);
});

balance.innerText="Balans: "+(income-expense);
incomeEl.innerText="Kirim: "+income;
expenseEl.innerText="Chiqim: "+expense;

drawChart(income,expense);
}

/* DELETE */
async function del(id){
await supabaseClient.from('transactions').delete().eq('id',id);
loadData();
}

/* EDIT */
function edit(id,amount){
editId=id;
editAmount.value=amount;
modal.classList.add('show');
}

async function saveEdit(){
await supabaseClient.from('transactions')
.update({amount:editAmount.value})
.eq('id',editId);
closeModal();
loadData();
}

function closeModal(){
modal.classList.remove('show');
}

/* CHART */
let chart;
function drawChart(income,expense){
if(chart) chart.destroy();
chart=new Chart(chartCanvas,{
type:'doughnut',
data:{
labels:['Kirim','Chiqim'],
datasets:[{
data:[income,expense]
}]
}
});
}

</script>

</body>
</html>
