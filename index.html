<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finance App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:url('bg.jpg') no-repeat center center/cover;
  min-height:100vh;
  color:#fff;
}

body::before{
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  top:0;left:0;
  z-index:-1;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.hidden{display:none;}

.card{
  position:relative;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border:1px solid rgba(255,255,255,0.2);
  padding:15px;
  margin-top:15px;
  border-radius:20px;
}

.logo{
  width:90px;
  display:block;
  margin:0 auto 15px;
}

/* INPUT */
.input-box{
  display:flex;
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

.input-box input{
  border:none;
  background:none;
  outline:none;
  color:#fff;
  width:100%;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;
  cursor:pointer;
}

/* ITEM */
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.06);
  transition:0.3s;
}

.item:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,0.12);
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  width:36px;
  height:36px;
  border-radius:10px;
  padding:0;
  font-size:16px;
}

.actions button:last-child{
  background:linear-gradient(135deg,#ef4444,#f87171);
}

/* CHART */
canvas{
  width:100%!important;
  height:230px!important;
}

/* MODAL */
#modal{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

#modal.show{display:flex;}

.modal-box{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth" class="container">
<img src="logo.jpg" class="logo">

<div class="card">
<h2>Login</h2>

<div class="input-box">
<input id="email" placeholder="Email">
</div>

<div class="input-box">
<input id="password" type="password" placeholder="Password">
</div>

<button onclick="signup()">Ro‘yxatdan o‘tish</button>
<button onclick="login()">Kirish</button>
</div>
</div>

<!-- APP -->
<div id="app" class="container hidden">

<div class="card">
<h2 id="balance">Balans: 0</h2>
<p id="income">Kirim: 0</p>
<p id="expense">Chiqim: 0</p>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">
<input id="amount" placeholder="Summa">
<select id="type">
<option value="income">Kirim</option>
<option value="expense">Chiqim</option>
</select>
<button onclick="add()">Qo‘shish</button>
</div>

<div class="card" id="list"></div>

<button onclick="logout()">Chiqish</button>

</div>

<!-- MODAL -->
<div id="modal">
<div class="modal-box">
<input id="editAmount">
<button onclick="saveEdit()">Saqlash</button>
<button onclick="closeModal()">Bekor</button>
</div>
</div>

<script>

const supabaseClient = supabase.createClient(
"https://stcuwmhrnokmyonycqcj.supabase.co",
"sb_publishable_-3rNzJ68C7OVcKGYOeDWvw_VC5n-jye"
);

let user=null;
let editId=null;
let chartInstance;

/* AUTH */
supabaseClient.auth.onAuthStateChange((event,session)=>{
if(session){
user=session.user;
openApp();
}else{
auth.classList.remove('hidden');
app.classList.add('hidden');
}
});

function openApp(){
auth.classList.add('hidden');
app.classList.remove('hidden');
loadData();
}

async function signup(){
await supabaseClient.auth.signUp({
email:email.value,
password:password.value
});
}

async function login(){
await supabaseClient.auth.signInWithPassword({
email:email.value,
password:password.value
});
}

async function logout(){
await supabaseClient.auth.signOut();
}

/* DATA */
async function add(){
await supabaseClient.from('transactions').insert({
type:type.value,
amount:Number(amount.value),
user_id:user.id
});
loadData();
}

async function loadData(){
let {data}=await supabaseClient.from('transactions')
.select('*').eq('user_id',user.id);

let income=0,expense=0;
list.innerHTML='';

data.forEach(t=>{
if(t.type==='income') income+=t.amount;
else expense+=t.amount;

let typeText = t.type==='income'?'Kirim':'Chiqim';

let div=document.createElement('div');
div.className='item';

div.innerHTML=`
<span>${typeText} - ${t.amount}</span>
<div class="actions">
<button onclick="edit('${t.id}',${t.amount})">✏️</button>
<button onclick="del('${t.id}')">❌</button>
</div>
`;

list.appendChild(div);
});

balance.innerText="Balans: "+(income-expense);
income.innerText="Kirim: "+income;
expense.innerText="Chiqim: "+expense;

drawChart(income,expense);
}

/* DELETE */
async function del(id){
await supabaseClient.from('transactions').delete().eq('id',id);
loadData();
}

/* EDIT */
function edit(id,amount){
editId=id;
editAmount.value=amount;
modal.classList.add('show');
}

async function saveEdit(){
await supabaseClient.from('transactions')
.update({amount:Number(editAmount.value)})
.eq('id',editId);

closeModal();
loadData();
}

function closeModal(){
modal.classList.remove('show');
}

/* CHART CENTER */
const centerText={
id:'centerText',
beforeDraw(chart){
const {width,height}=chart;
const ctx=chart.ctx;
ctx.restore();
ctx.font="16px sans-serif";
ctx.fillStyle="#fff";
ctx.textAlign="center";

let d=chart.data.datasets[0].data;
let bal=d[0]-d[1];

ctx.fillText("Balans: "+bal,width/2,height/2);
ctx.save();
}
};

/* CHART */
function drawChart(income,expense){

const ctx=document.getElementById('chart');

if(chartInstance) chartInstance.destroy();

chartInstance=new Chart(ctx,{
type:'doughnut',
data:{
labels:['Kirim','Chiqim'],
datasets:[{
data:[income,expense],
backgroundColor:[
'rgba(59,130,246,0.5)',
'rgba(239,68,68,0.5)'
],
borderWidth:2
}]
},
options:{cutout:'75%'},
plugins:[centerText]
});
}

</script>

</body>
</html>
