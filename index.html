<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:url('bg.jpg') no-repeat center/cover;
  color:#fff;
}

.container{max-width:420px;margin:auto;padding:15px;}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:20px;
  margin-top:15px;
}

input,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:#fff;
}

.btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#6366f1;
  color:#fff;
}

/* ITEM */
.item{position:relative;margin-top:10px;overflow:hidden;}

.swipe-content{
  background:rgba(255,255,255,0.05);
  padding:12px;
  border-radius:12px;
  transition:0.3s;
}

.swipe-actions{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  display:flex;
}

.swipe-actions button{
  width:60px;
  border:none;
  color:#fff;
}

.swipe-actions button:first-child{background:#6366f1;}
.swipe-actions button:last-child{background:#ef4444;}

#success{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}

#editModal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#111;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:300px;
}
</style>
</head>

<body>

<div id="success">✔ Saqlandi</div>

<div id="auth" class="container">
<div class="card">
<input id="email" placeholder="Email">
<input id="password" type="password">
<button class="btn" onclick="login()">Kirish</button>
<button class="btn" onclick="signup(event)">Ro‘yxatdan o‘tish</button>
</div>
</div>

<div id="app" class="container" style="display:none;">

<div class="card">
<h3 id="balance">0</h3>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">
<h4>Oylik statistika</h4>
<p id="monthIncome">Kirim: 0</p>
<p id="monthExpense">Chiqim: 0</p>
</div>

<div class="card">
<input id="amount" placeholder="Summa">
<input id="note" placeholder="Izoh">
<select id="type">
<option value="income">Kirim</option>
<option value="expense">Chiqim</option>
</select>
<button class="btn" onclick="add()">Qo‘shish</button>
</div>

<div id="list" class="card"></div>
<button class="btn" onclick="logout()">Chiqish</button>

</div>

<div id="editModal">
<div class="modal-box">
<input id="editAmount">
<input id="editNote">
<button onclick="saveEdit()">Saqlash</button>
</div>
</div>

<script>
const supabaseClient = supabase.createClient(
  "https://stcuwmhrnokmyonycqcj.supabase.co",
  "sb_publishable_-3rNzJ68C7OVcKGYOeDWvw_VC5n-jye"
);

let user=null, editId=null, chart;

function ok(){
  success.style.display='block';
  setTimeout(()=>success.style.display='none',1500);
}

supabaseClient.auth.onAuthStateChange((e,s)=>{
if(s){user=s.user;auth.style.display='none';app.style.display='block';load();}
else{auth.style.display='block';app.style.display='none';}
});

async function signup(e){
  const btn=e.target;
  btn.disabled=true;
  const {error}=await supabaseClient.auth.signUp({
    email:email.value,
    password:password.value
  });
  btn.disabled=false;
  if(error) alert(error.message); else ok();
}

async function login(){
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  if(error) alert(error.message);
}

async function logout(){
  await supabaseClient.auth.signOut();
}

async function add(){
  await supabaseClient.from('transactions').insert({
    type:type.value,
    amount:Number(amount.value),
    note:note.value,
    user_id:user.id
  });
  ok();load();
}

function getIcon(text){
  if(!text) return '💰';
  text=text.toLowerCase();
  if(text.includes('ovqat')) return '🍔';
  if(text.includes('taksi')) return '🚕';
  if(text.includes('internet')) return '📶';
  if(text.includes('o‘yin')) return '🎮';
  if(text.includes('ish')) return '💼';
  if(text.includes('ichimlik')) return '🥤';
  return '💰';
}

async function load(){
  let {data}=await supabaseClient.from('transactions')
    .select('*').eq('user_id',user.id);

  list.innerHTML='';
  let total=0, mInc=0, mExp=0;
  let month=new Date().getMonth();

  data.forEach(t=>{
    t.type==='income'?total+=t.amount:total-=t.amount;

    let d=new Date(t.created_at);
    if(d.getMonth()===month){
      t.type==='income'?mInc+=t.amount:mExp+=t.amount;
    }

    let div=document.createElement('div');
    div.className='item';

    div.innerHTML=`
      <div class="swipe-content">
        ${getIcon(t.note)} <b>${t.amount}</b><br>
        <small>${t.note||''}</small>
      </div>
      <div class="swipe-actions">
        <button onclick="edit('${t.id}','${t.amount}','${t.note}')">✏️</button>
        <button onclick="del('${t.id}')">❌</button>
      </div>
    `;

    let startX=0;
    div.addEventListener('touchstart',e=>startX=e.touches[0].clientX);
    div.addEventListener('touchmove',e=>{
      let diff=e.touches[0].clientX-startX;
      if(diff<0) div.querySelector('.swipe-content').style.transform=`translateX(${diff}px)`;
    });
    div.addEventListener('touchend',()=>{
      let el=div.querySelector('.swipe-content');
      if(el.style.transform.includes('-80')) el.style.transform='translateX(-120px)';
      else el.style.transform='translateX(0)';
    });

    list.appendChild(div);
  });

  balance.innerText="Balans: "+total;
  monthIncome.innerText="Kirim: "+mInc;
  monthExpense.innerText="Chiqim: "+mExp;

  const ctx=document.getElementById('chart');
  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Kirim','Chiqim'],
      datasets:[{
        data:[mInc,mExp],
        backgroundColor:['#22c55e','#ef4444']
      }]
    },
    options:{cutout:'70%'}
  });
}

async function del(id){
  await supabaseClient.from('transactions').delete().eq('id',id);
  load();
}

function edit(id,a,n){
  editId=id;
  editAmount.value=a;
  editNote.value=n;
  editModal.style.display='flex';
}

async function saveEdit(){
  await supabaseClient.from('transactions')
    .update({amount:Number(editAmount.value),note:editNote.value})
    .eq('id',editId);

  editModal.style.display='none';
  ok();load();
}
</script>

</body>
</html>
