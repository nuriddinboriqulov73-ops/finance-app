<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:url('bg.jpg') no-repeat center/cover;
  color:#fff;
  min-height:100vh;
}

.container{max-width:420px;margin:auto;padding:15px;}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:20px;
  margin-top:15px;
}

input,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:#fff;
}

.btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#6366f1;
  color:#fff;
}

/* ITEM */
.item{
  position:relative;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  transition:0.25s;
  overflow:hidden;
}

.item.new{animation:fadeUp 0.4s;}
.item.remove{transform:translateX(120px);opacity:0;}

/* swipe delete icon */
.item::after{
  content:'❌';
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  width:40px;
  height:40px;
  background:#ef4444;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:0.3s;
}

.item.swiping::after{
  opacity:1;
}

.success{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div id="success">✔ Saqlandi</div>

<div id="auth" class="container">
<div class="card">
<img src="logo.jpg" style="width:80px;margin:auto;display:block;">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">Kirish</button>
<button class="btn" onclick="signup(event)">Ro‘yxatdan o‘tish</button>
</div>
</div>

<div id="app" class="container" style="display:none;">
<div class="card">
<h3 id="balance">0</h3>
</div>

<div class="card">
<input id="amount" placeholder="Summa">
<input id="note" placeholder="Izoh">
<select id="type">
<option value="income">Kirim</option>
<option value="expense">Chiqim</option>
</select>
<button class="btn" onclick="add()">Qo‘shish</button>
</div>

<div id="list" class="card"></div>

<button class="btn" onclick="logout()">Chiqish</button>
</div>

<script>
const supabaseClient = supabase.createClient(
  "https://stcuwmhrnokmyonycqcj.supabase.co",
  "sb_publishable_-3rNzJ68C7OVcKGYOeDWvw_VC5n-jye" 
);

let user=null;

function ok(){
  success.style.display='block';
  setTimeout(()=>success.style.display='none',1500);
}

supabaseClient.auth.onAuthStateChange((e,s)=>{
if(s){user=s.user;auth.style.display='none';app.style.display='block';load();}
else{auth.style.display='block';app.style.display='none';}
});

async function signup(e){
  const btn=e.target;
  btn.disabled=true;

  const {error}=await supabaseClient.auth.signUp({
    email:email.value,
    password:password.value
  });

  btn.disabled=false;

  if(error) alert(error.message);
  else ok();
}

async function login(){
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  if(error) alert(error.message);
}

async function logout(){
  await supabaseClient.auth.signOut();
}

async function add(){
  await supabaseClient.from('transactions').insert({
    type:type.value,
    amount:Number(amount.value),
    note:note.value,
    user_id:user.id
  });
  ok();load();
}

async function load(){
  let {data}=await supabaseClient.from('transactions')
    .select('*').eq('user_id',user.id);

  list.innerHTML='';
  let total=0;

  data.forEach(t=>{
    t.type==='income'?total+=t.amount:total-=t.amount;

    let div=document.createElement('div');
    div.className='item new';

    div.innerHTML=`
      <b>${t.amount}</b> (${t.type})<br>
      <small>${t.note||''}</small>
      <div>
        <button onclick="edit('${t.id}','${t.amount}','${t.note}')">✏️</button>
        <button onclick="del('${t.id}')">❌</button>
      </div>
    `;

    let startX=0;

    div.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX;
    });

    div.addEventListener('touchmove',e=>{
      let diff=e.touches[0].clientX-startX;
      if(diff<0){
        div.style.transform=`translateX(${diff}px)`;
        if(diff<-20) div.classList.add('swiping');
      }
    });

    div.addEventListener('touchend',async ()=>{
      if(div.style.transform.includes('-80')){
        div.classList.add('remove');
        setTimeout(()=>del(t.id),300);
      }else{
        div.style.transform='translateX(0)';
        div.classList.remove('swiping');
      }
    });

    list.appendChild(div);
  });

  balance.innerText="Balans: "+total;
}

async function del(id){
  await supabaseClient.from('transactions').delete().eq('id',id);
  load();
}

async function edit(id,a,n){
  let na=prompt("Summa:",a);
  let nn=prompt("Izoh:",n);
  if(na===null) return;

  await supabaseClient.from('transactions')
    .update({amount:Number(na),note:nn})
    .eq('id',id);

  ok();load();
}
</script>

</body>
</html>
