<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background:url('bg.jpg') no-repeat center/cover;
  color:#fff;
  min-height:100vh;
}

.container{max-width:420px;margin:auto;padding:15px;}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:20px;
  margin-top:15px;
}

.logo{
  width:80px;
  display:block;
  margin:0 auto 10px;
}

input,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:#fff;
}

.btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  touch-action:manipulation;
}

#success{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}

/* item */
.item{margin-top:10px;}
</style>
</head>

<body>

<div id="success">✔ Saqlandi</div>

<!-- AUTH -->
<div id="auth" class="container">
  <form id="authForm" class="card">
    <img src="logo.jpg" class="logo">
    <input id="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <button class="btn" type="submit">Kirish</button>
    <button class="btn" type="button" id="signupBtn">Ro‘yxatdan o‘tish</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

<div class="card">
<h3 id="balance">0</h3>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">
<h4>Bugungi statistika</h4>
<p id="todayIncome">Kirim: 0</p>
<p id="todayExpense">Chiqim: 0</p>
</div>

<div class="card">
<h4>Oylik statistika</h4>
<p id="monthIncome">Kirim: 0</p>
<p id="monthExpense">Chiqim: 0</p>
</div>

<div class="card">
<input id="amount" placeholder="Summa">
<input id="note" placeholder="Izoh">
<select id="type">
<option value="income">Kirim</option>
<option value="expense">Chiqim</option>
</select>
<button class="btn" id="addBtn">Qo‘shish</button>
</div>

<div id="list" class="card"></div>
<button class="btn" id="logoutBtn">Chiqish</button>

</div>

<script>
const supabaseClient = supabase.createClient(
  "https://stcuwmhrnokmyonycqcj.supabase.co",
  "sb_publishable_-3rNzJ68C7OVcKGYOeDWvw_VC5n-jye"
);

let user=null, chart;

/* success */
function ok(){
  success.style.display='block';
  setTimeout(()=>success.style.display='none',1500);
}

/* auth */
supabaseClient.auth.onAuthStateChange((e,s)=>{
  if(s){
    user=s.user;
    auth.style.display='none';
    app.style.display='block';
    load();
  }else{
    auth.style.display='block';
    app.style.display='none';
  }
});

/* login */
authForm.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  if(error) alert(error.message);
});

/* signup */
signupBtn.addEventListener("click", async ()=>{
  const {error}=await supabaseClient.auth.signUp({
    email:email.value,
    password:password.value
  });
  if(error) alert(error.message);
  else ok();
});

/* add */
addBtn.addEventListener("click", async ()=>{
  await supabaseClient.from('transactions').insert({
    type:type.value,
    amount:Number(amount.value),
    note:note.value,
    user_id:user.id
  });
  ok(); load();
});

/* logout */
logoutBtn.addEventListener("click", async ()=>{
  await supabaseClient.auth.signOut();
});

/* icon */
function getIcon(text){
  if(!text) return '💰';
  text=text.toLowerCase();
  if(text.includes('ovqat')) return '🍔';
  if(text.includes('ichimlik')) return '🥤';
  return '💰';
}

/* load */
async function load(){
  let {data}=await supabaseClient.from('transactions')
    .select('*').eq('user_id',user.id);

  list.innerHTML='';
  let total=0;

  let today=new Date().toDateString();
  let month=new Date().getMonth();

  let tInc=0,tExp=0;
  let mInc=0,mExp=0;

  data.forEach(t=>{
    t.type==='income'?total+=t.amount:total-=t.amount;

    let d=new Date(t.created_at);

    if(d.toDateString()===today){
      t.type==='income'?tInc+=t.amount:tExp+=t.amount;
    }

    if(d.getMonth()===month){
      t.type==='income'?mInc+=t.amount:mExp+=t.amount;
    }

    let div=document.createElement('div');
    div.className='item';
    div.innerHTML=`
      ${getIcon(t.note)} ${t.amount}<br>
      <small>${t.note||''}</small>
    `;
    list.appendChild(div);
  });

  balance.innerText="Balans: "+total;
  todayIncome.innerText="Kirim: "+tInc;
  todayExpense.innerText="Chiqim: "+tExp;
  monthIncome.innerText="Kirim: "+mInc;
  monthExpense.innerText="Chiqim: "+mExp;

  const ctx=document.getElementById('chart');
  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Kirim','Chiqim'],
      datasets:[{
        data:[mInc,mExp],
        backgroundColor:['#22c55e','#ef4444']
      }]
    }
  });
}
</script>

</body>
</html>
